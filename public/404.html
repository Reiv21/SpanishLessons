<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      SPA fallback dla GitHub Pages.
      GitHub Pages nie zna tras Reacta (np. /lesson/1) i zwraca 404.
      Ten skrypt koduje ścieżkę do query stringa i przekierowuje do index.html,
      gdzie router odtwarza właściwy adres. pathSegmentsToKeep=1 bo strona
      działa w podkatalogu /SpanishLessons/.
    -->
    <script>
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
